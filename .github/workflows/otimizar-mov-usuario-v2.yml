name: Patch unico - consultas movimentacoes usuario V2

on:
  push:
    branches:
      - perf/otimizacao-global-v2
    paths:
      - .github/workflows/otimizar-mov-usuario-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reduzir consultas legadas repetidas
        shell: python
        run: |
          from pathlib import Path
          path = Path('update.js')
          text = path.read_text(encoding='utf-8')

          old_vars = '''  let painelMovUsuarioAberto = false;\n  let carregandoMovUsuario = false;\n  let movimentoEmEdicaoUsuario = null;'''
          new_vars = '''  let painelMovUsuarioAberto = false;\n  let carregandoMovUsuario = false;\n  let movimentoEmEdicaoUsuario = null;\n  let compatibilidadeMovUsuarioConferidaUid = "";'''

          old_query = '''      const uid = contextoMovUsuario.user.uid;\n      await carregarPagamentosMovUsuario(uid);\n      const [porChegada, porAtualizacao, porCriacao] = await Promise.all([\n        consultarPorCampoMovUsuario("chegadaRegistradaPor", uid),\n        consultarPorCampoMovUsuario("atualizadoPor", uid),\n        consultarPorCampoMovUsuario("criadoPor", uid)\n      ]);\n      const mapa = new Map();\n      [porChegada, porAtualizacao, porCriacao].filter(Boolean).forEach(snapshot => {\n        snapshot.docs.forEach(item => mapa.set(item.id, { id: item.id, ...item.data() }));\n      });'''
          new_query = '''      const uid = contextoMovUsuario.user.uid;\n      await carregarPagamentosMovUsuario(uid);\n      const precisaCompatibilidade = compatibilidadeMovUsuarioConferidaUid !== uid;\n      const porChegada = await consultarPorCampoMovUsuario("chegadaRegistradaPor", uid);\n      let porAtualizacao = null;\n      let porCriacao = null;\n      if (precisaCompatibilidade) {\n        [porAtualizacao, porCriacao] = await Promise.all([\n          consultarPorCampoMovUsuario("atualizadoPor", uid),\n          consultarPorCampoMovUsuario("criadoPor", uid)\n        ]);\n      }\n      const mapa = new Map();\n      [porChegada, porAtualizacao, porCriacao].filter(Boolean).forEach(snapshot => {\n        snapshot.docs.forEach(item => mapa.set(item.id, { id: item.id, ...item.data() }));\n      });'''

          old_migrate = '''      await marcarProprietarioChegadaLegada(movimentosRegistradosUsuario, uid);\n      renderMovimentacoesUsuario();'''
          new_migrate = '''      await marcarProprietarioChegadaLegada(movimentosRegistradosUsuario, uid);\n      if (precisaCompatibilidade) compatibilidadeMovUsuarioConferidaUid = uid;\n      renderMovimentacoesUsuario();'''

          for old, new, label in [
              (old_vars, new_vars, 'variaveis'),
              (old_query, new_query, 'consultas'),
              (old_migrate, new_migrate, 'migracao')
          ]:
              if new in text:
                  continue
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: trecho esperado apareceu {count} vez(es); abortando.')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')

      - name: Commitar se necessário
        shell: bash
        run: |
          if git diff --quiet -- update.js; then exit 0; fi
          git config user.name "99eliel"
          git config user.email "131190282+99eliel@users.noreply.github.com"
          git add update.js
          git commit -m "perf: consultar legado de movimentacoes uma vez por usuario"
          git push origin HEAD:${GITHUB_REF_NAME}
