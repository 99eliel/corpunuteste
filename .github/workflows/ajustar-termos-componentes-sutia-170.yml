name: Ajustar termos componentes Sutiã 170

on:
  push:
    branches: [main]
    paths:
      - '.ajustar-termos-componentes-sutia-170'

permissions:
  contents: write

jobs:
  ajustar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Alterar somente textos visiveis
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          p = Path('corponu-sutia-completo-calculo.js')
          s = p.read_text(encoding='utf-8')
          antigo_sim = '<option value="sim">${titulo} veio pronta</option>'
          antigo_nao = '<option value="nao">${titulo} não veio pronta</option>'
          novo_sim = '<option value="sim">${nome === "lateral" ? "Lateral feita pela facção" : "Bojo feito pela facção"}</option>'
          novo_nao = '<option value="nao">${nome === "lateral" ? "Lateral feita pela confecção" : "Bojo feito pela confecção"}</option>'
          if s.count(antigo_sim) != 1 or s.count(antigo_nao) != 1:
              raise SystemExit('Textos originais nao encontrados exatamente uma vez; abortando.')
          s = s.replace(antigo_sim, novo_sim).replace(antigo_nao, novo_nao)
          p.write_text(s, encoding='utf-8')

          release = {
            'version': '2026-08-11-teste-termos-componentes-sutia-170',
            'updatedAt': '2026-08-11T08:34:00-03:00',
            'notes': 'AMBIENTE DE TESTE. Altera somente os textos das opções de Lateral e Bojo na conferência do Sutiã Completo para feito pela facção ou feito pela confecção. Mantém a correção responsiva do Manejo, a Fase Lateral, a ALÇA em R$ 0,0270 e todas as regras de cálculo e pagamento inalteradas.'
          }
          Path('corponu-release.json').write_text(json.dumps(release, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Validar JavaScript e termos
        run: |
          node --check corponu-sutia-completo-calculo.js
          grep -q 'Lateral feita pela facção' corponu-sutia-completo-calculo.js
          grep -q 'Lateral feita pela confecção' corponu-sutia-completo-calculo.js
          grep -q 'Bojo feito pela facção' corponu-sutia-completo-calculo.js
          grep -q 'Bojo feito pela confecção' corponu-sutia-completo-calculo.js

      - name: Publicar e limpar temporarios
        run: |
          rm -f .ajustar-termos-componentes-sutia-170
          rm -f .github/workflows/ajustar-termos-componentes-sutia-170.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'teste: clarear origem de Lateral e Bojo 170 [skip ci]'
          git push origin HEAD:main
