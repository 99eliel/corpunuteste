name: Executar Fase Lateral 163

on:
  push:
    branches:
      - main
    paths:
      - '.trigger-fase-lateral-163'

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar patch integrado
        run: python tools/fase_lateral_163.py
      - name: Publicar resultado
        run: |
          rm -f .trigger-fase-lateral-163
          rm -f tools/fase_lateral_163.py
          rm -f .github/workflows/run-fase-lateral-163.yml
          rm -f .github/workflows/fase-lateral-integrada-163.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "teste: integrar Fase Lateral ao Manejo Sutia 163 [skip ci]"
          git push origin HEAD:main
