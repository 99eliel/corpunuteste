name: Corrigir ações menu Manejo 294

on:
  push:
    paths:
      - 'scripts/corrigir-acoes-menu-manejo-294.py'
      - '.github/workflows/corrigir-acoes-menu-manejo-294.yml'

permissions:
  contents: write

jobs:
  corrigir:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar correção estrutural
        run: python scripts/corrigir-acoes-menu-manejo-294.py

      - name: Validar sintaxe
        run: |
          cp app.js /tmp/app-294.mjs
          node --check /tmp/app-294.mjs

      - name: Validar escopo e invariantes
        run: |
          git diff --exit-code -- . ':(exclude)app.js' || (echo 'Mudança fora de app.js' && exit 1)
          grep -q 'data-manejo-acao="faccao"' app.js
          grep -q 'data-manejo-acao="celula"' app.js
          grep -q 'data-manejo-acao="ajustar"' app.js
          grep -q 'data-manejo-acao="historico"' app.js
          grep -q 'data-manejo-acao="limpar"' app.js
          grep -q 'switch (acao)' app.js
          ! grep -q 'onclick="window.fecharMenusAcoesManejo(); window.mandarParaFaccao' app.js

      - name: Commit da correção
        run: |
          if git diff --quiet -- app.js; then
            echo 'Nenhuma alteração necessária.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js
          git commit -m 'fix: executar ações do menu Manejo por controlador único 294'
          git push
