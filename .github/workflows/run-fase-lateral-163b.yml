name: Executar acabamento Fase Lateral 163b

on:
  push:
    branches:
      - main
    paths:
      - '.trigger-fase-lateral-163b'

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python tools/fix_fase_lateral_163b.py
      - run: |
          rm -f .trigger-fase-lateral-163b
          rm -f tools/fix_fase_lateral_163b.py
          rm -f .github/workflows/run-fase-lateral-163b.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "teste: finalizar Fase Lateral integrada 163b [skip ci]"
          git push origin HEAD:main
