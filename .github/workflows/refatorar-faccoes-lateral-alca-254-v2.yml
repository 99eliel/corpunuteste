name: Refatorar Facções Lateral e Alça 254 v2

on:
  push:
    branches:
      - refactor/faccoes-lateral-alca-254

permissions:
  contents: write

jobs:
  refatorar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refactor/faccoes-lateral-alca-254

      - name: Aplicar refatoração base e confirmar única pendência conhecida
        shell: bash
        run: |
          set +e
          SAIDA=$(python3 .github/scripts/refatorar-faccoes-lateral-alca-254.py 2>&1)
          CODIGO=$?
          set -e
          echo "$SAIDA"
          if [ "$CODIGO" -ne 1 ] || ! echo "$SAIDA" | grep -q 'Falhas finais: sem botão duplicado'; then
            echo 'A refatoração base falhou por um motivo diferente do esperado.'
            exit 1
          fi

      - name: Remover listener restante do botão substituto
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('corponu-faccoes-tres-abas-saida.js')
          s = p.read_text(encoding='utf-8')
          pattern = r'\n    if \(t\.closest\("#btnSaidaCorteNovo"\)\) \{\n      e\.preventDefault\(\);\n      e\.stopImmediatePropagation\(\);\n      abrir\("corte"\);\n    \}'
          s2, n = re.subn(pattern, '', s, count=1)
          if n != 1:
              raise SystemExit(f'Listener duplicado: esperado 1, encontrado {n}')
          p.write_text(s2, encoding='utf-8')
          PY

      - name: Garantias arquiteturais
        shell: bash
        run: |
          test -f corponu-faccoes-lateral-alca-254.js
          test ! -f corponu-faccoes-corte-definitivo.js
          ! grep -q 'btnSaidaCorteNovo' corponu-faccoes-tres-abas-saida.js
          ! grep -q 'corte: \["LATERAL", "ALÇA"\]' corponu-faccoes-tres-abas-saida.js
          grep -q 'listarFaccoesPorProcesso' corponu-faccoes-grupos-processos.js
          grep -q 'api.listarFaccoesPorProcesso(processo.nome)' corponu-faccoes-lateral-alca-254.js
          grep -q 'quantidade_recebida_x_2_x_valor_alca' corponu-faccoes-lateral-alca-254.js
          grep -q 'quantidade_recebida_x_valor_referencia' corponu-faccoes-lateral-alca-254.js
          grep -q 'const paymentId = `corte-${slug(movement.id)}`' corponu-faccoes-lateral-alca-254.js
          grep -q 'if (pagamentoPago(current))' corponu-faccoes-lateral-alca-254.js
          grep -q 'corponu-faccoes-lateral-alca-254.js' corponu-atualizador.js
          ! grep -q 'corponu-faccoes-corte-definitivo.js' corponu-atualizador.js

      - name: Validar sintaxe
        run: |
          node --check corponu-faccoes-lateral-alca-254.js
          node --check corponu-faccoes-tres-abas-saida.js
          node --check corponu-faccoes-grupos-processos.js
          node --check corponu-atualizador.js
          node --check tests/e2e/faccoes-consolidado.spec.js
          node --check tests/e2e/faccoes-lateral-alca-254.spec.js
          python3 -m json.tool corponu-release.json >/dev/null

      - name: Commitar versão homologável
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A corponu-atualizador.js corponu-faccoes-grupos-processos.js corponu-faccoes-tres-abas-saida.js corponu-faccoes-lateral-alca-254.js corponu-faccoes-corte-definitivo.js corponu-release.json tests/e2e/faccoes-consolidado.spec.js tests/e2e/faccoes-lateral-alca-254.spec.js
          git commit -m 'refactor: unificar Facções Lateral e Alça 254'
          git push origin HEAD:refactor/faccoes-lateral-alca-254
