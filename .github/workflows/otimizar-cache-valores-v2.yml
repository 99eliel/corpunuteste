name: Patch unico - cache valores update.js V2

on:
  push:
    branches:
      - perf/otimizacao-global-v2
    paths:
      - .github/workflows/otimizar-cache-valores-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar cache versionado ao arquivo de valores
        shell: python
        run: |
          from pathlib import Path

          path = Path('update.js')
          text = path.read_text(encoding='utf-8')

          old_const = '  const ARQUIVO_VALORES_PROCESSOS = "valores-processos-corponu-2026.json";\n'
          new_const = old_const + '  const VERSAO_ARQUIVO_VALORES_PROCESSOS = "2026-08-22-valores-cacheaveis-272";\n'

          old_fetch = '''    const response = await fetch(\n      `${ARQUIVO_VALORES_PROCESSOS}?v=${encodeURIComponent(APP_VERSION)}&ts=${Date.now()}`,\n      { cache: "no-store" }\n    );'''
          new_fetch = '''    const versaoArquivo = window.CORPONU_RELEASE_VERSION || VERSAO_ARQUIVO_VALORES_PROCESSOS;\n    const response = await fetch(\n      `${ARQUIVO_VALORES_PROCESSOS}?v=${encodeURIComponent(versaoArquivo)}`,\n      forcar ? { cache: "reload" } : undefined\n    );'''

          if 'VERSAO_ARQUIVO_VALORES_PROCESSOS' not in text:
              if text.count(old_const) != 1:
                  raise SystemExit(f'Constante alvo apareceu {text.count(old_const)} vez(es); abortando.')
              text = text.replace(old_const, new_const, 1)

          if old_fetch in text:
              if text.count(old_fetch) != 1:
                  raise SystemExit(f'Fetch alvo apareceu {text.count(old_fetch)} vez(es); abortando.')
              text = text.replace(old_fetch, new_fetch, 1)
          elif 'forcar ? { cache: "reload" } : undefined' not in text:
              raise SystemExit('Fetch antigo não encontrado e patch novo também não está presente.')

          path.write_text(text, encoding='utf-8')

      - name: Commitar somente se houve mudanca
        shell: bash
        run: |
          if git diff --quiet -- update.js; then
            echo "Nenhuma mudança necessária."
            exit 0
          fi
          git config user.name "99eliel"
          git config user.email "131190282+99eliel@users.noreply.github.com"
          git add update.js
          git commit -m "perf: cachear arquivo de valores por release"
          git push origin HEAD:${GITHUB_REF_NAME}
