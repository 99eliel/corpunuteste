name: Validar sugestoes oficiais de fase

on:
  push:
    paths:
      - '.github/workflows/corrigir-restauracao-automatica-fases.yml'

permissions:
  contents: write

jobs:
  corrigir:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Aplicar migração oficial da Fase Bojo
        run: node scripts/adicionar-migracao-fase-bojo-oficial.js

      - name: Validar JavaScript e invariantes
        run: |
          node --check update.js
          ! grep -F 'restauracaoFasesAntigasAutomaticaTentada' update.js
          ! grep -F 'restaurarOpcoesAntigasFases({ manual: false })' update.js
          grep -F 'restaurarOpcoesAntigasFases({ manual: true })' update.js
          grep -F 'Object.freeze(["BÁSICO SEM BOJO", "COM BOJO"])' update.js
          grep -F 'faseBojoOficial20260909V1' update.js
          grep -F 'await migrarFaseBojoOficialSeNecessario();' update.js
          git diff --check

      - name: Garantir escopo
        run: |
          arquivos="$(git diff --name-only | sort)"
          test "$arquivos" = "update.js"

      - name: Publicar no teste
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add update.js
          git commit -m 'test: migrar Fase Bojo para duas opções oficiais'
          git push origin HEAD:main

# segunda validacao: migracao versionada da configuracao oficial
