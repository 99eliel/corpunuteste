name: Validar fases Sutiã persistentes

on:
  push:
    paths:
      - '.github/workflows/validar-fases-sutia-persistentes-290.yml'

permissions:
  contents: write

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Aplicar correção
        run: node scripts/corrigir-fases-sutia-persistentes-290.js

      - name: Validar sintaxe e invariantes
        run: |
          node --check update.js
          grep -F 'CAMPO_FASES_SUTIA_EXCLUIDAS' update.js
          grep -F 'MARCADOR_RECONSTRUCAO_FASES_SUTIA' update.js
          grep -F 'alterarSugestaoFaseSutiaPersistente' update.js
          grep -F 'reconstruirListaFasesSutiaSeNecessario' update.js
          grep -F 'firestore.where("tipoAlvo", "==", "Sugestão de fase")' update.js
          grep -F 'restaurarOpcoesAntigasFases({ manual: true })' update.js
          ! grep -F 'restaurarOpcoesAntigasFases({ manual: false })' update.js
          ! grep -F 'FASES_BOJO_OFICIAIS' update.js
          ! grep -F 'migrarFaseBojoOficialSeNecessario' update.js
          git diff --check

      - name: Garantir escopo
        run: |
          arquivos="$(git diff --name-only | sort)"
          test "$arquivos" = "update.js"

      - name: Publicar no teste
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add update.js
          git commit -m 'test: tornar exclusões de fases do Sutiã persistentes'
          git push origin HEAD:main
