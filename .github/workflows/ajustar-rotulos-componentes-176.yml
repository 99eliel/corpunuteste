name: Ajustar rótulos componentes 176
on:
  push:
    branches: [main]
    paths: ['.ajustar-rotulos-componentes-176']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ajustar rótulos visuais
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path('corponu-sutia-completo-calculo.js')
          s=p.read_text(encoding='utf-8')
          old='''    if (informacaoDefinitiva(info)) {\n      return `\n        <div class="sc51-componente" data-componente="${nome}" data-descontar="${info.descontar === true || (info.descontar !== false && info.pronto === true) ? "1" : "0"}" data-feito-faccao="${info.feitoPelaFaccao === true ? "1" : "0"}" data-feito-confeccao="${info.feitoPelaConfeccao === true ? "1" : "0"}" data-origem-execucao="${escapar(info.origemExecucao || "")}">\n          <strong>${titulo}</strong>\n          <span class="sc51-pill ${info.pronto ? "sim" : "nao"}">${info.pronto ? "Pronta" : "Não pronta"}</span>\n          <small>${info.origem || "Informação registrada"}${info.responsavel ? ` • ${info.responsavel}` : ""}</small>\n        </div>`;\n    }'''
          new='''    if (informacaoDefinitiva(info)) {\n      const origemExecucao = normalizar(info.origemExecucao || "");\n      const indefinido = info.indefinido === true || origemExecucao === "NAO INFORMADO";\n      const feitoPelaFaccao = info.feitoPelaFaccao === true || origemExecucao === "FACCAO";\n      const feitoPelaConfeccao = info.feitoPelaConfeccao === true || origemExecucao === "CONFECCAO";\n      const descontar = info.descontar === true || (info.descontar !== false && info.pronto === true);\n\n      let rotuloOrigem = "Não informado";\n      let classeOrigem = "pendente";\n      if (!indefinido && feitoPelaFaccao) {\n        rotuloOrigem = "Feito pela facção";\n        classeOrigem = "sim";\n      } else if (!indefinido && feitoPelaConfeccao) {\n        rotuloOrigem = "Feito pela confecção";\n        classeOrigem = "nao";\n      } else if (!indefinido && typeof info.descontar === "boolean") {\n        rotuloOrigem = info.descontar ? "Feito pela confecção" : "Feito pela facção";\n        classeOrigem = info.descontar ? "nao" : "sim";\n      } else if (!indefinido && typeof info.pronto === "boolean") {\n        rotuloOrigem = descontar ? "Feito pela confecção" : "Feito pela facção";\n        classeOrigem = descontar ? "nao" : "sim";\n      }\n\n      return `\n        <div class="sc51-componente" data-componente="${nome}" data-descontar="${descontar ? "1" : "0"}" data-feito-faccao="${feitoPelaFaccao ? "1" : "0"}" data-feito-confeccao="${feitoPelaConfeccao ? "1" : "0"}" data-origem-execucao="${escapar(info.origemExecucao || "")}">\n          <strong>${titulo}</strong>\n          <span class="sc51-pill ${classeOrigem}">${rotuloOrigem}</span>\n          <small>${info.origem || "Informação registrada"}${info.responsavel ? ` • ${info.responsavel}` : ""}</small>\n        </div>`;\n    }'''
          if old not in s: raise SystemExit('bloco visual de componente não encontrado')
          s=s.replace(old,new,1)
          s=s.replace('Confirme o que veio pronto. Fecho e ponto de luz só geram desconto quando não vieram feitos.','Confirme quem fez a Lateral e o Bojo. Fecho e ponto de luz só geram desconto quando não vieram feitos.',1)
          p.write_text(s,encoding='utf-8')
          Path('corponu-release.json').write_text(json.dumps({
            'version':'2026-08-11-teste-rotulos-origem-componentes-176',
            'updatedAt':'2026-08-11T10:18:00-03:00',
            'notes':'AMBIENTE DE TESTE. Na conferência do Sutiã Completo, Lateral e Bojo deixam de aparecer como Pronta/Não pronta e passam a mostrar Feito pela facção, Feito pela confecção ou Não informado. A alteração é somente visual.'
          },ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Validar
        run: |
          node --check corponu-sutia-completo-calculo.js
          grep -q 'Feito pela facção' corponu-sutia-completo-calculo.js
          grep -q 'Feito pela confecção' corponu-sutia-completo-calculo.js
      - name: Publicar
        run: |
          rm -f .ajustar-rotulos-componentes-176 .github/workflows/ajustar-rotulos-componentes-176.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'teste: esclarecer origem de Lateral e Bojo 176 [skip ci]'
          git push
