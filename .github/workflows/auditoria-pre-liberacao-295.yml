name: Auditoria pre-liberacao 295

on:
  push:
    paths:
      - 'scripts/auditoria-pre-liberacao-295.js'
      - '.github/workflows/auditoria-pre-liberacao-295.yml'

permissions:
  contents: write

jobs:
  auditar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validar sintaxe atual
        run: |
          set -euo pipefail
          while IFS= read -r -d '' arquivo; do
            node --input-type=module --check < "$arquivo"
          done < <(find . -maxdepth 1 -type f -name '*.js' -print0)

      - name: Gerar auditoria
        run: node scripts/auditoria-pre-liberacao-295.js

      - name: Publicar somente o relatorio
        run: |
          set -euo pipefail
          git diff --check
          arquivos="$(git diff --name-only | sort)"
          test "$arquivos" = "AUDITORIA-PRE-LIBERACAO.md"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AUDITORIA-PRE-LIBERACAO.md
          git commit -m 'test: registrar auditoria pre-liberacao 295'
          git push
