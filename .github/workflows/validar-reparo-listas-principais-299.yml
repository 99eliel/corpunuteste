name: Validar reparo listas principais 299

on:
  push:
    paths:
      - 'scripts/reparar-listas-principais-299.js'
      - '.github/workflows/validar-reparo-listas-principais-299.yml'

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Baixar update.js exato da produção 298
        run: |
          curl -fsSL "https://raw.githubusercontent.com/99eliel/corponu1/d684c13adbb4003eeb111c0ef646518f669eff66/update.js" -o update.js
          grep -F '2026-09-09-reparo-listas-fases-298' update.js

      - name: Aplicar reparo 299
        run: node scripts/reparar-listas-principais-299.js

      - name: Validar sintaxe
        run: node --check update.js

      - name: Validar invariantes estruturais
        run: |
          grep -F 'async function repararListasPrincipaisFasesV299()' update.js
          grep -F 'reparoListasPrincipais20260909V299' update.js
          grep -F 'window.corponuDualMode?.state?.maps?.ordens' update.js
          grep -F 'firestore.collection(db, "logsAlteracoes")' update.js
          test "$(grep -c 'await repararListasPrincipaisFasesV299();' update.js)" -eq 2
          test "$(grep -c 'async function repararListasPrincipaisFasesV299()' update.js)" -eq 1
