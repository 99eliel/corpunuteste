name: Validar fases Calcinha 292

on:
  push:
    paths:
      - '.github/workflows/validar-fases-calcinha-292.yml'

permissions:
  contents: write

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Aplicar correção
        run: python3 scripts/corrigir-fases-calcinha-292.py

      - name: Validar sintaxe e invariantes
        run: |
          node --check update.js
          grep -F 'CAMPO_FASES_CALCINHA_EXCLUIDAS' update.js
          grep -F 'MARCADOR_RECONSTRUCAO_FASES_CALCINHA' update.js
          grep -F 'alterarSugestaoFaseCalcinhaPersistente' update.js
          grep -F 'reconstruirListaFasesCalcinhaSeNecessario' update.js
          grep -F 'firestore.where("tipoAlvo", "==", "Sugestão de fase da Calcinha")' update.js
          grep -F 'await alterarSugestaoFaseCalcinhaPersistente(fase, "adicionar")' update.js
          grep -F 'await alterarSugestaoFaseCalcinhaPersistente(fase, "remover")' update.js
          grep -F 'await reconstruirListaFasesCalcinhaSeNecessario()' update.js
          grep -F 'adicionarFaseAoConjunto(calcinha, setores?.calcinha?.fase)' update.js
          grep -F 'adicionarFaseAoConjunto(calcinha, dados?.manejoCalcinha?.fase)' update.js
          grep -F 'adicionarFaseAoConjunto(calcinha, dados?.faseCalcinha)' update.js
          ! grep -F 'const exclusoesPersistentes = documentoId === FASES_CONFIG_DOCUMENTO' update.js
          git diff --check

      - name: Garantir escopo
        run: |
          arquivos="$(git diff --name-only | sort)"
          test "$arquivos" = "update.js"

      - name: Publicar no teste
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add update.js
          git commit -m 'test: limpar e persistir fases da Calcinha 292'
          git push origin HEAD:main
