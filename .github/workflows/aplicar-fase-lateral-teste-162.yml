name: Aplicar Fase Lateral no Manejo de teste

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/aplicar-fase-lateral-teste-162.yml'

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório de teste
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recuperar módulo de Fase Bojo e Fase Lateral do backup do teste
        run: |
          git fetch origin backup/pre-sync-principal-2026-08-10
          git checkout origin/backup/pre-sync-principal-2026-08-10 -- corponu-manejo-fases-teste-157.js

      - name: Carregar módulos de teste na release atual
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('corponu-pagamentos-alerta-duplicidades.js')
          text = path.read_text(encoding='utf-8')

          anchor = '  const VERSION_QUANTIDADE_SEM_SCROLL = "2026-08-07-quantidade-sem-scroll-148";\n'
          insert = anchor + '  const VERSION_MANEJO_FASES_TESTE = "2026-08-10-teste-manejo-fases-162";\n  const VERSION_MANEJO_LAYOUT_TESTE = "2026-08-10-teste-manejo-layout-162";\n'
          if 'VERSION_MANEJO_FASES_TESTE' not in text:
              if anchor not in text:
                  raise SystemExit('Âncora das versões não encontrada no loader atual.')
              text = text.replace(anchor, insert, 1)

          loader_anchor = '  // 160 atua somente na tabela do antigo módulo Corte, hoje exibido como\n'
          bloco = '''  // TESTE 162: adiciona somente no Manejo Sutiã a Fase Lateral e renomeia\n  // visualmente a fase já existente para Fase Bojo. O módulo mantém dados separados.\n  carregarScript(\n    "corponu-manejo-fases-teste-157.js",\n    "manejo-fases-teste-162",\n    VERSION_MANEJO_FASES_TESTE,\n    "Não foi possível carregar Fase Bojo/Fase Lateral no Manejo de teste."\n  );\n\n  // TESTE 162: OP, REF e QTI ficam compactos e fixos; as demais colunas\n  // usam o espaço restante da tela sem alterar a lógica operacional.\n  carregarScript(\n    "corponu-manejo-layout-teste-162.js",\n    "manejo-layout-teste-162",\n    VERSION_MANEJO_LAYOUT_TESTE,\n    "Não foi possível aplicar o layout compacto do Manejo de teste."\n  );\n\n'''
          if 'corponu-manejo-fases-teste-157.js' not in text:
              if loader_anchor not in text:
                  raise SystemExit('Âncora de carregamento não encontrada no loader atual.')
              text = text.replace(loader_anchor, bloco + loader_anchor, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Criar ajuste de largura da tabela
        run: |
          cat > corponu-manejo-layout-teste-162.js <<'EOF'
          (() => {
            "use strict";

            const VERSION = "2026-08-10-teste-manejo-layout-162";
            const STYLE_ID = "corponuManejoLayoutTeste162";
            if (window.__CORPONU_MANEJO_LAYOUT_TESTE_162__ === VERSION) return;
            window.__CORPONU_MANEJO_LAYOUT_TESTE_162__ = VERSION;

            if (document.getElementById(STYLE_ID)) return;
            const style = document.createElement("style");
            style.id = STYLE_ID;
            style.textContent = `
              /* TESTE 162 — somente Manejo Sutiã com Fase Lateral ativa. */
              #manejo .table-wrap {
                max-width: 100% !important;
                overflow-x: auto !important;
              }

              #manejo .manejo-inline-table.manejo-fases-teste-157 {
                width: 100% !important;
                min-width: 0 !important;
                max-width: 100% !important;
                table-layout: fixed !important;
              }

              #manejo .manejo-inline-table.manejo-fases-teste-157 th,
              #manejo .manejo-inline-table.manejo-fases-teste-157 td {
                min-width: 0 !important;
                box-sizing: border-box !important;
              }

              /* Nº OP: compacto e invariável. */
              #manejo .manejo-inline-table.manejo-fases-teste-157 th:nth-child(1),
              #manejo .manejo-inline-table.manejo-fases-teste-157 td:nth-child(1) {
                width: 82px !important;
                min-width: 82px !important;
                max-width: 82px !important;
              }

              /* Referência: compacta e invariável. */
              #manejo .manejo-inline-table.manejo-fases-teste-157 th:nth-child(2),
              #manejo .manejo-inline-table.manejo-fases-teste-157 td:nth-child(2) {
                width: 88px !important;
                min-width: 88px !important;
                max-width: 88px !important;
              }

              /* QTI vira a 7ª coluna após inserir Fase Lateral. */
              #manejo .manejo-inline-table.manejo-fases-teste-157 th:nth-child(7),
              #manejo .manejo-inline-table.manejo-fases-teste-157 td:nth-child(7) {
                width: 70px !important;
                min-width: 70px !important;
                max-width: 70px !important;
              }

              /* Ações permanece enxuta; todo o restante reparte o espaço livre. */
              #manejo .manejo-inline-table.manejo-fases-teste-157 th:nth-child(11),
              #manejo .manejo-inline-table.manejo-fases-teste-157 td:nth-child(11) {
                width: 58px !important;
                min-width: 58px !important;
                max-width: 58px !important;
              }

              #manejo .manejo-inline-table.manejo-fases-teste-157 th:nth-child(3),
              #manejo .manejo-inline-table.manejo-fases-teste-157 td:nth-child(3),
              #manejo .manejo-inline-table.manejo-fases-teste-157 th:nth-child(4),
              #manejo .manejo-inline-table.manejo-fases-teste-157 td:nth-child(4),
              #manejo .manejo-inline-table.manejo-fases-teste-157 th:nth-child(5),
              #manejo .manejo-inline-table.manejo-fases-teste-157 td:nth-child(5),
              #manejo .manejo-inline-table.manejo-fases-teste-157 th:nth-child(6),
              #manejo .manejo-inline-table.manejo-fases-teste-157 td:nth-child(6),
              #manejo .manejo-inline-table.manejo-fases-teste-157 th:nth-child(8),
              #manejo .manejo-inline-table.manejo-fases-teste-157 td:nth-child(8),
              #manejo .manejo-inline-table.manejo-fases-teste-157 th:nth-child(9),
              #manejo .manejo-inline-table.manejo-fases-teste-157 td:nth-child(9),
              #manejo .manejo-inline-table.manejo-fases-teste-157 th:nth-child(10),
              #manejo .manejo-inline-table.manejo-fases-teste-157 td:nth-child(10) {
                width: auto !important;
                min-width: 0 !important;
                max-width: none !important;
              }

              #manejo .manejo-inline-table.manejo-fases-teste-157 input,
              #manejo .manejo-inline-table.manejo-fases-teste-157 select,
              #manejo .manejo-inline-table.manejo-fases-teste-157 textarea,
              #manejo .manejo-inline-table.manejo-fases-teste-157 .silk-fields,
              #manejo .manejo-inline-table.manejo-fases-teste-157 .tecido-fields,
              #manejo .manejo-inline-table.manejo-fases-teste-157 .fase-plus {
                width: 100% !important;
                min-width: 0 !important;
                max-width: 100% !important;
                box-sizing: border-box !important;
              }

              @media (max-width: 1100px) {
                #manejo .manejo-inline-table.manejo-fases-teste-157 {
                  min-width: 1120px !important;
                }
              }
            `;
            document.head.appendChild(style);
          })();
          EOF

      - name: Atualizar marcador da release de teste
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('corponu-release.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          data['version'] = '2026-08-10-teste-manejo-fase-lateral-162'
          data['updatedAt'] = '2026-08-10T12:45:00-03:00'
          data['notes'] = ('AMBIENTE DE TESTE. No Manejo Sutiã, a fase existente passa a aparecer como Fase Bojo e foi adicionada uma Fase Lateral independente, com filtro múltiplo, sugestões gerenciáveis pelo administrador e salvamento em manejosSetores.sutia.faseLateral. OP, REF e QTI ficam compactos com largura fixa; os demais campos repartem o espaço restante da tela. Manejo Calcinha e o sistema principal não foram alterados.')
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Remover workflow temporário e publicar
        run: |
          rm -f .github/workflows/aplicar-fase-lateral-teste-162.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "teste: Fase Lateral no Manejo Sutiã e layout compacto 162 [skip ci]"
          git push origin HEAD:main
