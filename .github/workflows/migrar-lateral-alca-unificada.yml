name: Migrar Lateral e Alca Unificada

on:
  push:
    branches:
      - perf/otimizacao-global-v1
    paths:
      - scripts/migrar-lateral-alca-unificada.py
      - .github/workflows/migrar-lateral-alca-unificada.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrar:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4
        with:
          ref: perf/otimizacao-global-v1
          fetch-depth: 0

      - name: Aplicar migracao
        run: python3 scripts/migrar-lateral-alca-unificada.py

      - name: Validar JavaScript
        run: |
          node --check corponu-faccoes-corte-definitivo.js
          node --check corponu-faccoes-tres-abas-saida.js
          node --check corponu-atualizador.js
          node --check tests/e2e/faccoes-consolidado.spec.js

      - name: Conferir remendos desligados
        shell: bash
        run: |
          ! grep -q 'corponu-faccoes-lateral-alca-integracao.js' corponu-atualizador.js
          ! grep -q 'corponu-faccoes-label-lateral.js' corponu-atualizador.js
          ! grep -q 'new MutationObserver' corponu-faccoes-corte-definitivo.js
          grep -q 'movimentoPertenceLateralAlca' corponu-faccoes-corte-definitivo.js
          grep -q 'btnChegadaManualLateralAlca' corponu-faccoes-corte-definitivo.js
          grep -q 'Lateral e Alça' corponu-faccoes-tres-abas-saida.js

      - name: Salvar migracao na branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add corponu-faccoes-corte-definitivo.js corponu-faccoes-tres-abas-saida.js corponu-atualizador.js tests/e2e/faccoes-consolidado.spec.js
          git rm scripts/migrar-lateral-alca-unificada.py .github/workflows/migrar-lateral-alca-unificada.yml
          git diff --cached --check
          git commit -m 'refactor: unificar lateral e alca sem integracao paralela'
          git push origin HEAD:perf/otimizacao-global-v1
