name: Aplicar sugestões Fase Lateral 165

on:
  push:
    branches: [main]
    paths: ['.trigger-fase-lateral-sugestoes-165']

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar patch seguro
        run: python tools/patch_fase_lateral_sugestoes_165.py
      - name: Validar JavaScript
        run: |
          node --check update.js
          node --check app.js
      - name: Commitar somente se validou
        run: |
          rm -f .trigger-fase-lateral-sugestoes-165
          rm -f tools/patch_fase_lateral_sugestoes_165.py
          rm -f .github/workflows/temp-fase-lateral-sugestoes-165.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "teste: gerenciar sugestões da Fase Lateral 165 [skip ci]"
          git push origin HEAD:main
