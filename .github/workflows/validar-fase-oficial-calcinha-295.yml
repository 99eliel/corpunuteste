name: Validar fase oficial da Calcinha 295

on:
  push:
    paths:
      - '.github/workflows/validar-fase-oficial-calcinha-295.yml'

permissions:
  contents: write

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Aplicar correção estrutural
        run: TARGET=corponu-manejo-calcinha-dedicado-252.js node scripts/corrigir-fase-oficial-calcinha-295.js

      - name: Validar sintaxe e invariantes
        run: |
          node --check corponu-manejo-calcinha-dedicado-252.js
          grep -F 'FASES_CONFIG_DOCUMENTO = "fasesManejoCalcinha"' corponu-manejo-calcinha-dedicado-252.js
          grep -F 'function renderCampoFaseOficialCalcinha' corponu-manejo-calcinha-dedicado-252.js
          grep -F 'async function validarFaseOficialCalcinhaAntesDeSalvar' corponu-manejo-calcinha-dedicado-252.js
          grep -F 'somenteServidor: true' corponu-manejo-calcinha-dedicado-252.js
          grep -F 'Essa fase não está cadastrada pelo administrador para a Calcinha.' corponu-manejo-calcinha-dedicado-252.js
          ! grep -F 'fasesManejoExtras' corponu-manejo-calcinha-dedicado-252.js
          ! grep -F 'document.querySelectorAll("#manejoFasesList option")' corponu-manejo-calcinha-dedicado-252.js
          ! grep -F 'type="text" list="${DATALIST_ID}"' corponu-manejo-calcinha-dedicado-252.js
          git diff --check

      - name: Garantir escopo
        run: |
          arquivos="$(git diff --name-only | sort)"
          test "$arquivos" = "corponu-manejo-calcinha-dedicado-252.js"

      - name: Publicar no teste
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add corponu-manejo-calcinha-dedicado-252.js
          git commit -m 'test: bloquear fase livre no Manejo Calcinha'
          git push origin HEAD:main
