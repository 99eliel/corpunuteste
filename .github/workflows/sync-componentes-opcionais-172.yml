name: Sync componentes opcionais 172
on:
  push:
    branches: [main]
    paths: ['.sync-componentes-opcionais-172']
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copiar módulos validados do principal
        run: |
          curl -fsSL https://raw.githubusercontent.com/99eliel/corponu1/main/corponu-sutia-completo-calculo.js -o corponu-sutia-completo-calculo.js
          curl -fsSL https://raw.githubusercontent.com/99eliel/corponu1/main/corponu-sutia-completo-chegada-rapida.js -o corponu-sutia-completo-chegada-rapida.js
          cat > corponu-release.json <<'JSON'
          {
            "version": "2026-08-11-teste-componentes-opcionais-172",
            "updatedAt": "2026-08-11T08:56:00-03:00",
            "notes": "AMBIENTE DE TESTE. Lateral e Bojo podem ficar como Não sei / não informado sem bloquear a chegada. O nome de quem fez é opcional. Origem desconhecida mantém o pagamento aguardando definição; facção não desconta e confecção desconta. Mantém a correção responsiva exclusiva do teste."
          }
          JSON
      - name: Validar
        run: |
          node --check corponu-sutia-completo-calculo.js
          node --check corponu-sutia-completo-chegada-rapida.js
          grep -q 'value="nao_informado"' corponu-sutia-completo-calculo.js
          grep -q 'Quem fez? (opcional)' corponu-sutia-completo-calculo.js
      - name: Publicar
        run: |
          rm -f .sync-componentes-opcionais-172 .github/workflows/sync-componentes-opcionais-172.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A && git commit -m 'teste: permitir componentes não informados 172 [skip ci]' && git push
