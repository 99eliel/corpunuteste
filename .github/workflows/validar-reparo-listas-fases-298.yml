name: Validar reparo listas de fases 298

on:
  push:
    paths:
      - '.github/workflows/validar-reparo-listas-fases-298.yml'

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do ambiente de teste
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Usar exatamente o update.js atual da produção 297
        run: |
          curl -fsSL 'https://raw.githubusercontent.com/99eliel/corponu1/2a7b082dfb630745e7d129c27ff2722e3200c677/update.js' -o update.js
          grep -F '2026-09-09-saida-fantasma-canonica-297' update.js

      - name: Aplicar reparo estrutural
        run: node scripts/reparar-listas-fases-298.js

      - name: Validar sintaxe e invariantes
        run: |
          node --check update.js
          grep -F 'reparoFasesSutiaVazias20260909V1' update.js
          grep -F 'reparoFasesCalcinhaVazias20260909V1' update.js
          grep -F 'reparoFasesLateralVazias20260909V1' update.js
          grep -F 'CAMPO_FASES_LATERAL_EXCLUIDAS' update.js
          grep -F 'async function reconstruirListaFasesLateralSeNecessario()' update.js
          grep -F 'async function alterarSugestaoFaseLateralPersistente' update.js
          grep -F 'async function mesclarFasesLateralRecuperadas' update.js
          ! grep -F 'alterarListaFasesLateralComTransacao(' update.js
          test "$(grep -c 'configuração oficial não será criada sem dados' update.js)" -eq 2
          test "$(grep -c 'MARCADOR_REPARO_FASES_SUTIA_VAZIAS' update.js)" -ge 4
          test "$(grep -c 'MARCADOR_REPARO_FASES_CALCINHA_VAZIAS' update.js)" -ge 4
          test "$(grep -c 'MARCADOR_REPARO_FASES_LATERAL_VAZIAS' update.js)" -ge 3
          grep -F 'Esta lista define as fases que podem ser selecionadas e salvas no Manejo do Sutiã.' update.js
          git diff --check -- update.js

      - name: Garantir que o reparo não mexe em outros arquivos funcionais
        run: |
          arquivos="$(git diff --name-only | sort)"
          test "$arquivos" = "update.js"

      - name: Resumo
        run: |
          echo 'Reparo 298 validado sobre o update.js exato da produção 297.'
          echo 'Nenhum arquivo foi publicado por esta validação.'
