name: Corrigir inicialização Fase Lateral 165b

on:
  push:
    branches: [main]
    paths: ['.trigger-fase-lateral-165b']

permissions:
  contents: write

jobs:
  corrigir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python tools/fix_fase_lateral_165b.py
      - run: |
          node --check update.js
          node --check app.js
      - run: |
          rm -f .trigger-fase-lateral-165b tools/fix_fase_lateral_165b.py .github/workflows/temp-fase-lateral-165b.yml
          git config user.name "github-actions[bot]"
          git config user.email "4189822+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "teste: corrigir inicialização das sugestões lateral 165b [skip ci]"
          git push origin HEAD:main
