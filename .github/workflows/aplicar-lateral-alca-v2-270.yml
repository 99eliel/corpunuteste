name: Aplicar Lateral e Alça V2 270 (teste)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aplicar-lateral-alca-v2-270.yml'

permissions:
  contents: write

jobs:
  migrar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar reconstrução estrutural
        run: python scripts/migrar-lateral-alca-v2-270.py

      - name: Validar JavaScript e JSON
        run: |
          node --check corponu-faccoes-corte-definitivo.js
          node --check corponu-faccoes-tres-abas-saida.js
          node --check corponu-atualizador.js
          node --check tests/e2e/faccoes-consolidado.spec.js
          python -m json.tool corponu-release.json >/dev/null
          python -m json.tool version.json >/dev/null
          git diff --check

      - name: Validar pós-condições
        run: |
          grep -F 'CORTAGEM E MONTAGEM' corponu-faccoes-corte-definitivo.js
          grep -F 'const VALOR_FIXO_CORTAGEM_MONTAGEM = 0.0540' corponu-faccoes-corte-definitivo.js
          grep -F 'window.CorpoNuFaccoesLateralAlca = api' corponu-faccoes-corte-definitivo.js
          grep -F 'window.CorpoNuFaccoesLateralAlca?.mostrar?.()' corponu-faccoes-tres-abas-saida.js
          ! grep -F 'btnSaidaCorteNovo' corponu-faccoes-tres-abas-saida.js
          ! grep -F 'new MutationObserver' corponu-faccoes-corte-definitivo.js
          ! grep -F '[900, 2200, 4800]' corponu-faccoes-corte-definitivo.js

      - name: Commit da homologação
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add corponu-faccoes-corte-definitivo.js corponu-faccoes-tres-abas-saida.js corponu-atualizador.js index.html update.js corponu-release.json version.json tests/e2e/faccoes-consolidado.spec.js
          if git diff --cached --quiet; then
            echo 'Nenhuma alteração necessária.'
            exit 0
          fi
          git commit -m 'refactor: reconstruir Lateral e Alça V2 270'
          git push
