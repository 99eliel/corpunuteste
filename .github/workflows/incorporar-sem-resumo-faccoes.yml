name: Incorporar regra de canceladas em Faccoes

on:
  push:
    branches:
      - perf/otimizacao-global-v1
    paths:
      - .github/workflows/incorporar-sem-resumo-faccoes.yml

permissions:
  contents: write

jobs:
  incorporar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4
        with:
          ref: perf/otimizacao-global-v1
          fetch-depth: 0

      - name: Incorporar comportamento definitivo
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          modulo = Path('corponu-faccoes-corte-definitivo.js')
          atualizador = Path('corponu-atualizador.js')
          remendo = Path('corponu-faccoes-sem-resumo-processos.js')
          workflow = Path('.github/workflows/incorporar-sem-resumo-faccoes.yml')

          texto = modulo.read_text(encoding='utf-8')

          alvo_filtro = '''    return movimentos.filter(item => {\n      const text = norm([item.numeroOP, item.referencia, item.cor, item.processo, item.destino, item.status].join(" "));\n      if (search && !text.includes(search)) return false;'''
          novo_filtro = '''    return movimentos.filter(item => {\n      const text = norm([item.numeroOP, item.referencia, item.cor, item.processo, item.destino, item.status].join(" "));\n      // Canceladas ficam fora da visão normal e aparecem somente no filtro específico.\n      if (!status && movimentoCancelado(item)) return false;\n      if (search && !text.includes(search)) return false;'''
          if alvo_filtro not in texto:
              raise SystemExit('Trecho do filtro de movimentações não encontrado com segurança.')
          texto = texto.replace(alvo_filtro, novo_filtro, 1)

          alvo_acoes = '''      const canCancelBefore = !item.dataChegada && (ehAdmin() || String(item.criadoPor || "") === String(user?.uid || ""));\n      const canCancelAfter = item.dataChegada && ehAdmin();'''
          novo_acoes = '''      const canCancelBefore = !movimentoCancelado(item) && !item.dataChegada && (ehAdmin() || String(item.criadoPor || "") === String(user?.uid || ""));\n      const canCancelAfter = !movimentoCancelado(item) && item.dataChegada && ehAdmin();'''
          if alvo_acoes not in texto:
              raise SystemExit('Trecho das ações de cancelamento não encontrado com segurança.')
          texto = texto.replace(alvo_acoes, novo_acoes, 1)
          modulo.write_text(texto, encoding='utf-8')

          linhas = atualizador.read_text(encoding='utf-8').splitlines()
          linhas = [linha for linha in linhas if 'corponu-faccoes-sem-resumo-processos.js' not in linha]
          atualizador.write_text('\n'.join(linhas) + '\n', encoding='utf-8')

          if remendo.exists():
              remendo.unlink()
          if workflow.exists():
              workflow.unlink()
          PY

      - name: Validar limpeza
        shell: bash
        run: |
          node --check corponu-faccoes-corte-definitivo.js
          ! grep -q 'corponu-faccoes-sem-resumo-processos.js' corponu-atualizador.js
          grep -q 'if (!status && movimentoCancelado(item)) return false;' corponu-faccoes-corte-definitivo.js
          git diff --check

      - name: Salvar limpeza
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: remover remendo de resumo e canceladas em faccoes'
          git push origin HEAD:perf/otimizacao-global-v1
