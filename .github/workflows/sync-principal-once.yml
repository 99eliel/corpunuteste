name: Sincronizar principal no teste

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/sync-principal-once.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório de teste
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clonar sistema principal
        run: git clone --depth 1 --branch main https://github.com/99eliel/corponu1.git /tmp/corponu-principal

      - name: Espelhar conteúdo do principal
        run: |
          rsync -a --delete --exclude='.git' /tmp/corponu-principal/ ./

      - name: Confirmar sincronização
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nenhuma diferença para sincronizar."
            exit 0
          fi
          git commit -m "sync: espelhar corponu1 no corpunuteste [skip ci]"
          git push origin HEAD:main
