name: Patch unico - alinhar release V2

on:
  push:
    branches:
      - perf/otimizacao-global-v2
    paths:
      - .github/workflows/alinha-release-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Alinhar release e testes
        shell: python
        run: |
          from pathlib import Path
          import json

          antigo = '2026-08-21-sutia-gravador-unico-268'
          novo = '2026-08-22-otimizacao-v2-273'

          updater = Path('corponu-atualizador.js')
          texto = updater.read_text(encoding='utf-8')
          alvo = f'const LOCAL_RELEASE = "{antigo}";'
          substituto = f'const LOCAL_RELEASE = "{novo}";'
          if substituto not in texto:
              if texto.count(alvo) != 1:
                  raise SystemExit(f'LOCAL_RELEASE antigo apareceu {texto.count(alvo)} vez(es); abortando.')
              texto = texto.replace(alvo, substituto, 1)
              updater.write_text(texto, encoding='utf-8')

          release_path = Path('corponu-release.json')
          release = json.loads(release_path.read_text(encoding='utf-8'))
          release['version'] = novo
          release['updatedAt'] = '2026-08-22T00:20:00-03:00'
          release['notes'] = (
              'HOMOLOGAÇÃO / OTIMIZAÇÃO GLOBAL V2. Gravador único e transacional para Sutiã Completo; '
              'remoção de fallbacks, polling e patches globais; cache versionado do arquivo de valores; '
              'inicialização única do update.js; remoção de limpeza PWA duplicada; consultas legadas de '
              'movimentações reduzidas para uma varredura por usuário/sessão; módulos e preços carregados sob demanda. '
              'Firebase permanece isolado no projeto corponuteste.'
          )
          release_path.write_text(json.dumps(release, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          total = 0
          pasta = Path('tests/e2e')
          for arquivo in pasta.glob('*.spec.js'):
              conteudo = arquivo.read_text(encoding='utf-8')
              quantidade = conteudo.count(antigo)
              if quantidade:
                  arquivo.write_text(conteudo.replace(antigo, novo), encoding='utf-8')
                  total += quantidade
          print(f'Expectativas de release atualizadas nos testes: {total}')

      - name: Commitar se necessário
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "99eliel"
          git config user.email "131190282+99eliel@users.noreply.github.com"
          git add corponu-atualizador.js corponu-release.json tests/e2e
          git commit -m "chore: alinhar release final da otimizacao v2"
          git push origin HEAD:${GITHUB_REF_NAME}
