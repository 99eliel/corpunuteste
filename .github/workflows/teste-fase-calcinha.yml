name: CorpoNu - Manejo Calcinha Dedicado Real

on:
  push:
    paths:
      - 'tests/e2e/manejo-calcinha-salvamento-real.spec.js'
      - 'tests/e2e/manejo-calcinha-dedicado-252.spec.js'
      - 'corponu-manejo-calcinha-dedicado-252.js'
      - 'corponu-dual-mode.js'
      - 'corponu-atualizador.js'
      - 'app.js'
      - '.github/workflows/teste-fase-calcinha.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manejo-calcinha-dedicado-real
  cancel-in-progress: true

jobs:
  manejo-calcinha:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Blindar Firebase de homologacao
        run: python3 scripts/aplicar-firebase-homologacao.py

      - name: Garantir ambiente de teste
        shell: bash
        run: |
          if grep -q "corponu-b4942" app.js login-core.js; then
            echo "ERRO: configuracao de producao detectada."
            exit 1
          fi
          grep -q 'projectId: "corponuteste"' app.js
          grep -q 'projectId: "corponuteste"' login-core.js

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm install

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Preparar fases oficiais E2E da Calcinha
        env:
          TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
        run: npx playwright test tests/e2e/preparar-homologacao-calcinha.spec.js --project=chromium-desktop --workers=1

      - name: Testar arquitetura dedicada
        run: npx playwright test tests/e2e/manejo-calcinha-dedicado-252.spec.js --project=chromium-desktop --workers=1

      - name: Testar salvamento real OP 12346
        env:
          TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
          TEST_OP_CALCINHA: ${{ vars.TEST_OP_CALCINHA || '12346' }}
        run: npx playwright test tests/e2e/manejo-calcinha-salvamento-real.spec.js --project=chromium-desktop --workers=1

      - name: Salvar diagnostico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manejo-calcinha-dedicado-diagnostico-${{ github.run_number }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
