name: Patch unico - limpeza PWA duplicada V2

on:
  push:
    branches:
      - perf/otimizacao-global-v2
    paths:
      - .github/workflows/otimizar-pwa-duplicado-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remover limpeza automatica duplicada do update.js
        shell: python
        run: |
          from pathlib import Path
          path = Path('update.js')
          text = path.read_text(encoding='utf-8')
          old = '''  window.addEventListener("load", () => {\n    rememberVersion();\n    unregisterOldWorkers();\n    clearAppCaches();\n    // Atualização agora é feita pelo navegador, sem PWA.\n    iniciarRecursosDaVersao();\n  });'''
          new = '''  window.addEventListener("load", () => {\n    rememberVersion();\n    // A remoção automática do PWA antigo já é feita no index e no atualizador oficial.\n    iniciarRecursosDaVersao();\n  });'''
          if old in text:
              if text.count(old) != 1:
                  raise SystemExit(f'Trecho alvo apareceu {text.count(old)} vez(es); abortando.')
              text = text.replace(old, new, 1)
          elif 'A remoção automática do PWA antigo já é feita no index e no atualizador oficial.' not in text:
              raise SystemExit('Trecho antigo não encontrado e patch novo ausente.')
          path.write_text(text, encoding='utf-8')

      - name: Commitar se necessário
        shell: bash
        run: |
          if git diff --quiet -- update.js; then exit 0; fi
          git config user.name "99eliel"
          git config user.email "131190282+99eliel@users.noreply.github.com"
          git add update.js
          git commit -m "perf: remover limpeza pwa duplicada no boot"
          git push origin HEAD:${GITHUB_REF_NAME}
