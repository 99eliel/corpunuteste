name: Corrigir cadastro valores teste 174
on:
  push:
    branches: [main]
    paths: ['.corrigir-cadastro-valores-174']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar correção
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          old='''                <select id="precoReferenciaSetor" class="hidden" aria-hidden="true" required>\n                  <option value="bojo" selected>Bojo</option>\n                </select>'''
          new='''                <input id="precoReferenciaSetor" type="hidden" value="bojo" />'''
          if old not in s: raise SystemExit('campo setor antigo não encontrado')
          s=s.replace(old,new,1); p.write_text(s,encoding='utf-8')

          p=Path('corponu-sutia-completo-calculo.js'); s=p.read_text(encoding='utf-8')
          old='''      lateral: {\n        conhecido: true,\n        pronto: typeof conferencia.lateralPronta === "boolean" ? conferencia.lateralPronta : contexto.lateral.pronto,\n        origem: conferencia.lateralOrigem || contexto.lateral.origem,\n        responsavel: conferencia.lateralResponsavel || contexto.lateral.responsavel\n      },\n      bojo: {\n        conhecido: true,\n        pronto: typeof conferencia.bojoPronto === "boolean" ? conferencia.bojoPronto : contexto.bojo.pronto,\n        origem: conferencia.bojoOrigem || contexto.bojo.origem,\n        responsavel: conferencia.bojoResponsavel || contexto.bojo.responsavel\n      },'''
          new='''      lateral: {\n        conhecido: true,\n        pronto: typeof conferencia.lateralPronta === "boolean" ? conferencia.lateralPronta : contexto.lateral.pronto,\n        descontar: typeof conferencia.lateralDescontada === "boolean" ? conferencia.lateralDescontada : (contexto.lateral.descontar === true || (contexto.lateral.descontar !== false && contexto.lateral.pronto === true)),\n        indefinido: (conferencia.lateralOrigemExecucao || contexto.lateral.origemExecucao) === "nao_informado",\n        feitoPelaFaccao: typeof conferencia.lateralFeitaPelaFaccao === "boolean" ? conferencia.lateralFeitaPelaFaccao : contexto.lateral.feitoPelaFaccao === true,\n        feitoPelaConfeccao: typeof conferencia.lateralFeitaPelaConfeccao === "boolean" ? conferencia.lateralFeitaPelaConfeccao : contexto.lateral.feitoPelaConfeccao === true,\n        origemExecucao: conferencia.lateralOrigemExecucao || contexto.lateral.origemExecucao || "",\n        origem: conferencia.lateralOrigem || contexto.lateral.origem,\n        responsavel: conferencia.lateralResponsavel || contexto.lateral.responsavel\n      },\n      bojo: {\n        conhecido: true,\n        pronto: typeof conferencia.bojoPronto === "boolean" ? conferencia.bojoPronto : contexto.bojo.pronto,\n        descontar: typeof conferencia.bojoDescontado === "boolean" ? conferencia.bojoDescontado : (contexto.bojo.descontar === true || (contexto.bojo.descontar !== false && contexto.bojo.pronto === true)),\n        indefinido: (conferencia.bojoOrigemExecucao || contexto.bojo.origemExecucao) === "nao_informado",\n        feitoPelaFaccao: typeof conferencia.bojoFeitaPelaFaccao === "boolean" ? conferencia.bojoFeitaPelaFaccao : contexto.bojo.feitoPelaFaccao === true,\n        feitoPelaConfeccao: typeof conferencia.bojoFeitoPelaConfeccao === "boolean" ? conferencia.bojoFeitoPelaConfeccao : contexto.bojo.feitoPelaConfeccao === true,\n        origemExecucao: conferencia.bojoOrigemExecucao || contexto.bojo.origemExecucao || "",\n        origem: conferencia.bojoOrigem || contexto.bojo.origem,\n        responsavel: conferencia.bojoResponsavel || contexto.bojo.responsavel\n      },'''
          # corrigir typo propositalmente antes da substituição final
          new=new.replace('bojoFeitaPelaFaccao','bojoFeitoPelaFaccao')
          if old not in s: raise SystemExit('bloco de recálculo não encontrado')
          s=s.replace(old,new,1)
          marker='''  async function recalcularPendentesDaOP(op) {'''
          target='''  async function recalcularPendentesDaReferencia(referencia) {\n    const ref = referenciaNormalizada(referencia);\n    if (!ref) return { atualizados: 0, ignorados: 0, aguardando: 0 };\n    await carregarConfig();\n    precosCache.expiraEm = 0;\n    await carregarPrecos(true);\n    const ctx = await firebase();\n    const encontrados = new Map();\n    const valores = [ref];\n    const numerica = Number(ref);\n    if (Number.isFinite(numerica)) valores.push(numerica);\n    for (const valor of valores) {\n      try {\n        const snap = await ctx.fs.getDocs(ctx.fs.query(ctx.fs.collection(ctx.db, "entregasPagamento"), ctx.fs.where("referencia", "==", valor)));\n        snap.docs.forEach(item => encontrados.set(item.id, { id: item.id, ...item.data() }));\n      } catch (error) { console.warn("Pendências da referência não consultadas.", error); }\n    }\n    const resultado = { atualizados: 0, ignorados: 0, aguardando: 0 };\n    for (const pagamento of encontrados.values()) {\n      if (processoCanonico(pagamento.processo || pagamento.servicoNome || pagamento.processoMovimentacao) !== PROCESSO_COMPLETO) continue;\n      try {\n        const item = await recalcularPagamentoExistente(pagamento);\n        if (item.tipo === "atualizado") resultado.atualizados += 1;\n        else if (item.tipo === "aguardando") resultado.aguardando += 1;\n        else resultado.ignorados += 1;\n      } catch (error) { console.warn("Pagamento da referência não recalculado.", pagamento.id, error); resultado.aguardando += 1; }\n    }\n    return resultado;\n  }\n\n'''+marker
          if marker not in s: raise SystemExit('ponto de inserção não encontrado')
          s=s.replace(marker,target,1)
          old='''    recalcularPendentes,\n    atualizarStatusOP:'''; new='''    recalcularPendentes,\n    recalcularPendentesDaReferencia,\n    atualizarStatusOP:'''
          if old not in s: raise SystemExit('export API não encontrado')
          s=s.replace(old,new,1); p.write_text(s,encoding='utf-8')

          p=Path('app.js'); s=p.read_text(encoding='utf-8')
          old='''    processoValorAtivo = chaveProcessoValor(processo, setor);\n    limparFormPrecoReferencia();\n    preencherProcessosValores();\n    renderProcessosValores();\n    renderPrecosReferencia();\n    toast("Valor salvo.");'''
          new='''    processoValorAtivo = chaveProcessoValor(processo, setor);\n    limparFormPrecoReferencia();\n    preencherProcessosValores();\n    renderProcessosValores();\n    renderPrecosReferencia();\n\n    let pendenciasAtualizadas = 0;\n    if (["LATERAL", "ENCAPAR BOJO"].includes(processo) && typeof window.CorpoNuSutiaCompleto?.recalcularPendentesDaReferencia === "function") {\n      try {\n        const resultadoPendencias = await window.CorpoNuSutiaCompleto.recalcularPendentesDaReferencia(referencia);\n        pendenciasAtualizadas = Number(resultadoPendencias?.atualizados || 0);\n      } catch (error) { console.warn("Valor salvo, mas pendências do Sutiã Completo não foram recalculadas automaticamente.", error); }\n    }\n    toast(pendenciasAtualizadas > 0 ? `Valor salvo. ${pendenciasAtualizadas} pagamento(s) pendente(s) recalculado(s).` : "Valor salvo.");'''
          if old not in s: raise SystemExit('salvarPrecoReferencia não encontrado')
          s=s.replace(old,new,1); p.write_text(s,encoding='utf-8')

          Path('corponu-release.json').write_text(json.dumps({'version':'2026-08-11-teste-cadastro-valores-pendencias-174','updatedAt':'2026-08-11T09:28:00-03:00','notes':'AMBIENTE DE TESTE. Corrige o cadastro de LATERAL/ENCAPAR BOJO e recalcula somente pendências de SUTIÃ COMPLETO da mesma referência ao salvar o valor. Mantém a responsividade exclusiva do teste.'},ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Validar
        run: |
          node --check app.js
          node --check corponu-sutia-completo-calculo.js
          grep -q 'id="precoReferenciaSetor" type="hidden"' index.html
          grep -q 'recalcularPendentesDaReferencia' corponu-sutia-completo-calculo.js
      - name: Publicar
        run: |
          rm -f .corrigir-cadastro-valores-174 .github/workflows/corrigir-cadastro-valores-174.yml
          git config user.name github-actions[bot]
          git config user.email 418982+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'teste: cadastrar valores e recalcular pendências da referência 174 [skip ci]'
          git push
