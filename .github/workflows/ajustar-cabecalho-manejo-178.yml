name: Ajustar cabecalho Manejo 178
on:
  push:
    branches: [main]
    paths: ['.ajustar-cabecalho-manejo-178']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corrigir somente textos do cabecalho
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          p = Path('app.js')
          s = p.read_text(encoding='utf-8')
          antigo = '''  const tabelaManejo = document.querySelector("#manejo .manejo-inline-table");\n  if (tabelaManejo) tabelaManejo.classList.toggle("manejo-sutia-ativo", setorAtual === "sutia");\n  const cabecalhoFase = tabelaManejo?.querySelector(".manejo-head-row th:nth-child(5)");\n  if (cabecalhoFase) cabecalhoFase.textContent = setorAtual === "sutia" ? "FASE BOJO" : "FASE";\n'''
          novo = '''  const tabelaManejo = document.querySelector("#manejo .manejo-inline-table");\n  if (tabelaManejo) tabelaManejo.classList.toggle("manejo-sutia-ativo", setorAtual === "sutia");\n\n  const cabecalhosManejo = tabelaManejo?.querySelectorAll(".manejo-head-row th");\n  if (cabecalhosManejo?.length) {\n    const nomesFixos = ["Nº OP", "REF", "SILK", "TECIDO"];\n    nomesFixos.forEach((nome, indice) => {\n      if (cabecalhosManejo[indice]) cabecalhosManejo[indice].textContent = nome;\n    });\n    if (cabecalhosManejo[4]) cabecalhosManejo[4].textContent = setorAtual === "sutia" ? "FASE BOJO" : "FASE";\n    if (setorAtual === "sutia" && cabecalhosManejo[5]) cabecalhosManejo[5].textContent = "FASE LATERAL";\n  }\n'''
          if antigo not in s:
            raise SystemExit('Trecho do cabecalho nao encontrado; nada foi alterado.')
          s = s.replace(antigo, novo, 1)
          p.write_text(s, encoding='utf-8')
          Path('corponu-release.json').write_text(json.dumps({
            'version':'2026-08-11-teste-cabecalho-manejo-178',
            'updatedAt':'2026-08-11T11:15:00-03:00',
            'notes':'AMBIENTE DE TESTE. Correção exclusivamente textual do cabeçalho do Manejo: restaura TECIDO e mantém FASE BOJO/FASE LATERAL no Sutiã e FASE na Calcinha. Nenhuma lógica, filtro, largura ou salvamento foi alterado.'
          }, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Validar
        run: |
          node --check app.js
          grep -q '"TECIDO"' app.js
          grep -q '"FASE LATERAL"' app.js
      - name: Publicar
        run: |
          rm -f .ajustar-cabecalho-manejo-178 .github/workflows/ajustar-cabecalho-manejo-178.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.js corponu-release.json
          git rm -f --ignore-unmatch .ajustar-cabecalho-manejo-178 .github/workflows/ajustar-cabecalho-manejo-178.yml
          git commit -m 'teste: corrigir somente nomes do cabecalho do Manejo 178 [skip ci]'
          git push
