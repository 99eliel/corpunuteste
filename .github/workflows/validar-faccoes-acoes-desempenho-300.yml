name: Validar Facções ações e desempenho 300

on:
  push:
    paths:
      - 'scripts/corrigir-faccoes-acoes-desempenho-300-v2.js'
      - '.github/workflows/validar-faccoes-acoes-desempenho-300.yml'

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Baixar app.js exato da produção 299
        run: |
          curl -fsSL 'https://raw.githubusercontent.com/99eliel/corponu1/2f44150e1d06b7242653d4047e4ddb4ec73e16c9/app.js' -o app.js
          grep -F 'const OTIMIZACAO_LEITURAS_ATIVA = true;' app.js

      - name: Aplicar correção estrutural 300
        run: node scripts/corrigir-faccoes-acoes-desempenho-300-v2.js

      - name: Validar sintaxe e invariantes
        run: |
          node --check app.js
          grep -F 'function instalarControladorAcoesFaccoes()' app.js
          grep -F 'data-faccoes-acao="chegada"' app.js
          grep -F 'data-faccoes-acao="bipar"' app.js
          grep -F 'data-faccoes-acao="excluir"' app.js
          grep -F 'function reconstruirIndiceMovimentacoes()' app.js
          grep -F 'function invalidarCacheIdentidadeFaccoes()' app.js
          grep -F 'reconstruirIndiceMovimentacoes();' app.js
          grep -F 'renderPaginaAtiva();' app.js
          test "$(grep -c 'function instalarControladorAcoesFaccoes()' app.js)" -eq 1
          test "$(grep -c 'const movimentacoesPorId = new Map();' app.js)" -eq 1
          git diff --check

      - name: Validar escopo lógico das ações de Facções
        run: |
          node <<'NODE'
          const fs = require('fs');
          const s = fs.readFileSync('app.js','utf8');
          const a = s.indexOf('function htmlAcaoChegadaFaccoes(mov) {');
          const b = s.indexOf('function getFiltrosFaccoesMovimentacoes()', a);
          const c = s.indexOf('function renderFaccoesMovimentacoes() {');
          const d = s.indexOf('\nfunction ', c + 40);
          const chegada = s.slice(a,b);
          const render = s.slice(c,d);
          if (chegada.includes('onclick="registrarChegadaMovimentacao')) throw new Error('onclick de chegada ainda presente');
          if (render.includes('onclick="biparMovimentacao')) throw new Error('onclick de bipar ainda presente');
          if (render.includes('onclick="excluirMovimentacao')) throw new Error('onclick de excluir ainda presente');
          if (!render.includes('instalarControladorAcoesFaccoes();')) throw new Error('controlador não instalado no render');
          NODE

      - name: Publicar app.js validado no teste
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js
          git commit -m 'test: estabilizar ações e desempenho de Facções 300'
          git push origin HEAD:main
