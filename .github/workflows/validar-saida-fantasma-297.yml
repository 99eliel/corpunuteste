name: Validar saída fantasma 297

on:
  push:
    paths:
      - '.github/workflows/validar-saida-fantasma-297.yml'

permissions:
  contents: write

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Alinhar módulo com produção 296
        run: |
          curl -fsSL https://raw.githubusercontent.com/99eliel/corponu1/main/corponu-faccoes-tres-abas-saida.js -o corponu-faccoes-tres-abas-saida.js
          grep -F 'const V = "2026-09-04-faccoes-saida-controlada-285";' corponu-faccoes-tres-abas-saida.js

      - name: Aplicar correção 297
        run: node scripts/corrigir-saida-fantasma-297.js

      - name: Validar sintaxe e cenários
        run: |
          node --check corponu-faccoes-tres-abas-saida.js
          node scripts/testar-saida-fantasma-297.js
          grep -F 'function tipoDestinoCanonicoMovimentacao(mov)' corponu-faccoes-tres-abas-saida.js
          grep -F 'function localizarSaidaFaccaoEmAndamento(c, processoAtual)' corponu-faccoes-tres-abas-saida.js
          grep -F 'normalizadoSaidaFantasma297: true' corponu-faccoes-tres-abas-saida.js
          ! grep -F 'return !m.dataChegada && !m.cancelado && !m.excluido && norm(m.status) !== "CANCELADO" && norm(m.processo) === processo;' corponu-faccoes-tres-abas-saida.js
          git diff --check

      - name: Garantir escopo funcional exato
        run: |
          arquivos="$(git diff --name-only | sort)"
          esperado="corponu-faccoes-tres-abas-saida.js"
          test "$arquivos" = "$esperado"

      - name: Publicar correção no teste
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add corponu-faccoes-tres-abas-saida.js
          git commit -m 'test: corrigir saída fantasma de Facções 297'
          git push origin HEAD:main
