name: Corrigir valor da ALCA 168

on:
  push:
    branches: [main]
    paths: ['.trigger-alca-0270-168']

permissions:
  contents: write

jobs:
  corrigir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Corrigir valor unitario da ALCA
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          p = Path('corponu-alca-pendencia-leve-126.js')
          s = p.read_text(encoding='utf-8')
          trocas = {
            'const VERSION = "2026-08-10-alca-00540-valores-4casas-162";': 'const VERSION = "2026-08-10-alca-00270-correcao-168";',
            'const VALOR_MIGRACAO = 0.0540;': 'const VALOR_MIGRACAO = 0.0270;',
            'const VALOR_ANTIGO = 0.0500;': 'const VALOR_ANTIGO = 0.0540;',
            '"migracao_0_0500_para_0_0540"': '"correcao_0_0540_duas_alcas_para_0_0270_unitario"'
          }
          for velho, novo in trocas.items():
            if velho not in s:
              raise SystemExit(f'Âncora não encontrada em alca-pendencia: {velho}')
            s = s.replace(velho, novo, 1)
          p.write_text(s, encoding='utf-8')

          p = Path('corponu-alca-recalcular-pendentes-163.js')
          s = p.read_text(encoding='utf-8')
          trocas = {
            'const VERSION = "2026-08-10-alca-recalculo-pendentes-163";': 'const VERSION = "2026-08-10-alca-recalculo-00270-168";',
            'const VALOR_ALCA = 0.0540;': 'const VALOR_ALCA = 0.0270;',
            'const VALOR_POR_SUTIA = 0.1080;': 'const VALOR_POR_SUTIA = 0.0540;',
            'const MARCADOR_ID = "migracao-alca-pendentes-00540-163";': 'const MARCADOR_ID = "correcao-alca-pendentes-00270-168";',
            'já foram recalculados para R$ 0,0540.': 'já foram recalculados para R$ 0,0270 por alça.',
            'Atualiza somente pagamentos de ALÇA ainda pendentes para R$ 0,0540. Pagos não são alterados.': 'Atualiza somente pagamentos de ALÇA ainda pendentes para R$ 0,0270 por alça (R$ 0,0540 por sutiã). Pagos não são alterados.'
          }
          for velho, novo in trocas.items():
            if velho not in s:
              raise SystemExit(f'Âncora não encontrada em recalculo: {velho}')
            s = s.replace(velho, novo, 1)
          p.write_text(s, encoding='utf-8')

          release_path = Path('corponu-release.json')
          data = json.loads(release_path.read_text(encoding='utf-8'))
          data['version'] = '2026-08-10-teste-alca-00270-responsivo-168'
          data['updatedAt'] = '2026-08-10T16:00:00-03:00'
          data['notes'] = ('AMBIENTE DE TESTE. Mantém a correção responsiva 167 e corrige o valor da ALÇA: R$ 0,0270 por alça e R$ 0,0540 por sutiã (2 alças). O valor incorreto R$ 0,0540 unitário é migrado para R$ 0,0270. O recálculo administrativo usa novo marcador e continua alterando somente pagamentos pendentes; pagos permanecem intocados. Fase Lateral e valores com 4 casas permanecem inalterados.')
          release_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Validar JavaScript e valores
        run: |
          node --check corponu-alca-pendencia-leve-126.js
          node --check corponu-alca-recalcular-pendentes-163.js
          grep -q 'VALOR_MIGRACAO = 0.0270' corponu-alca-pendencia-leve-126.js
          grep -q 'VALOR_ALCA = 0.0270' corponu-alca-recalcular-pendentes-163.js
          grep -q 'VALOR_POR_SUTIA = 0.0540' corponu-alca-recalcular-pendentes-163.js

      - name: Publicar
        run: |
          rm -f .trigger-alca-0270-168 .github/workflows/corrigir-valor-alca-168.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'teste: corrigir ALÇA para 0,0270 por unidade 168 [skip ci]'
          git push origin HEAD:main
