<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Sistema OP Confecção</title>
  <style>
    html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#f4f6f8;color:#172033}
    .loader{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box}
    .loader-card{background:#fff;border-radius:16px;box-shadow:0 18px 50px rgba(15,23,42,.12);padding:24px 28px;max-width:420px;width:100%;text-align:center}
    .loader-card strong{display:block;font-size:16px;margin-bottom:7px}.loader-card span{font-size:13px;color:#64748b;line-height:1.5}
    .loader-error button{margin-top:16px;border:0;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer;background:#173c69;color:#fff}
  </style>
</head>
<body>
  <div class="loader" id="corponuLoader">
    <div class="loader-card">
      <strong>Carregando o sistema...</strong>
      <span>Conferindo a versão mais recente.</span>
    </div>
  </div>

  <script>
    (() => {
      "use strict";

      const LOADER_BUILD = "2026-08-17-auto-update-por-aba-172";
      const SHELL_URL = "./corponu-app.html";
      const RELEASE_URL = "./corponu-release.json";

      const dormir = ms => new Promise(resolve => setTimeout(resolve, ms));

      async function buscarComTentativas(url, tentativas = 4) {
        let ultimoErro = null;
        for (let tentativa = 1; tentativa <= tentativas; tentativa += 1) {
          try {
            const separador = url.includes("?") ? "&" : "?";
            const resposta = await fetch(`${url}${separador}ts=${Date.now()}-${tentativa}`, {
              cache: "no-store",
              headers: {
                "Cache-Control": "no-cache, no-store, must-revalidate",
                "Pragma": "no-cache"
              }
            });
            if (!resposta.ok) throw new Error(`HTTP ${resposta.status}`);
            return resposta;
          } catch (erro) {
            ultimoErro = erro;
            if (tentativa < tentativas) await dormir(700 * tentativa);
          }
        }
        throw ultimoErro || new Error("Falha ao buscar arquivo.");
      }

      async function obterRelease() {
        try {
          const resposta = await buscarComTentativas(RELEASE_URL, 3);
          const dados = await resposta.json();
          return String(dados?.version || "").trim() || LOADER_BUILD;
        } catch (erro) {
          console.warn("[CorpoNu Loader] Não foi possível consultar a release.", erro);
          const url = new URL(window.location.href);
          return url.searchParams.get("release") || LOADER_BUILD;
        }
      }

      function criarVigiaRelease(release) {
        return `<script>(()=>{\n` +
          `"use strict";\n` +
          `const RELEASE_CARREGADA=${JSON.stringify(release)};\n` +
          `const INTERVALO=15000;\n` +
          `let verificando=false;let atualizando=false;\n` +
          `window.__CORPONU_RELEASE_REAL__=RELEASE_CARREGADA;\n` +
          `async function buscarRelease(){const r=await fetch('./corponu-release.json?watch='+Date.now(),{cache:'no-store',headers:{'Cache-Control':'no-cache, no-store, must-revalidate','Pragma':'no-cache'}});if(!r.ok)throw new Error('HTTP '+r.status);const d=await r.json();return String(d&&d.version||'').trim();}\n` +
          `function mostrar(msg){let e=document.getElementById('corponuWatchdogUpdate');if(!e){e=document.createElement('div');e.id='corponuWatchdogUpdate';e.style.cssText='position:fixed;right:18px;bottom:18px;z-index:2147483647;background:#111827;color:#fff;padding:12px 15px;border-radius:12px;box-shadow:0 14px 40px rgba(15,23,42,.28);font:700 13px/1.4 Arial,sans-serif;max-width:360px';document.body.appendChild(e);}e.textContent=msg;}\n` +
          `async function limpar(){try{if('serviceWorker'in navigator&&navigator.serviceWorker.getRegistrations){const rs=await navigator.serviceWorker.getRegistrations();await Promise.all(rs.map(r=>r.unregister()));}}catch(_){}try{if('caches'in window){const ks=await caches.keys();await Promise.all(ks.filter(k=>k.startsWith('op-confeccao-')||k.startsWith('corponu-')).map(k=>caches.delete(k)));}}catch(_){}}\n` +
          `async function carregarIndexNovo(remote){mostrar('Nova versão encontrada. Atualizando o sistema...');await limpar();try{const r=await fetch('./index.html?watchReload='+Date.now(),{cache:'no-store',headers:{'Cache-Control':'no-cache, no-store, must-revalidate','Pragma':'no-cache'}});if(!r.ok)throw new Error('HTTP '+r.status);const html=await r.text();if(!/<html[\\s>]/i.test(html))throw new Error('index inválido');try{const u=new URL(location.href);u.searchParams.set('release',remote);u.searchParams.set('autoupdate',String(Date.now()));history.replaceState(null,'',u.toString());}catch(_){}document.open();document.write(html);document.close();return;}catch(err){console.warn('[CorpoNu Watchdog] fallback por navegação.',err);}const u=new URL(location.href);u.searchParams.set('release',remote);u.searchParams.set('autoupdate',String(Date.now()));u.searchParams.set('_cb',String(Date.now()));location.replace(u.toString());}\n` +
          `async function verificar(){if(verificando||atualizando)return;verificando=true;try{const remote=await buscarRelease();if(remote&&remote!==RELEASE_CARREGADA){atualizando=true;await carregarIndexNovo(remote);}}catch(err){console.debug('[CorpoNu Watchdog] verificação indisponível.',err);}finally{verificando=false;}}\n` +
          `setInterval(verificar,INTERVALO);setTimeout(verificar,3000);\n` +
          `document.addEventListener('visibilitychange',()=>{if(!document.hidden)verificar();});\n` +
          `window.addEventListener('focus',verificar);window.addEventListener('pageshow',verificar);window.addEventListener('online',verificar);\n` +
          `window.__CORPONU_RELEASE_WATCHDOG__={release:RELEASE_CARREGADA,verificar};\n` +
          `})();<\/script>`;
      }

      function aplicarVersaoNosAssets(html, release) {
        const versao = encodeURIComponent(release);
        const instante = Date.now();

        let resultado = String(html || "").replace(
          /((?:src|href)=["'](?:\.\/)?(?!https?:|\/\/)[^"'?#]+?\.(?:js|css))(?:\?[^"']*)?(["'])/gi,
          `$1?v=${versao}&cb=${instante}$2`
        );

        resultado = resultado.replace(
          /(<meta\s+name=["']app-version["']\s+content=["'])[^"']*(["'])/i,
          `$1${release}$2`
        );

        const bootstrap = `<script>window.__CORPONU_ASSET_VERSION__=${JSON.stringify(release)};window.__CORPONU_LOADER_BUILD__=${JSON.stringify(LOADER_BUILD)};window.__CORPONU_LOADER_AT__=${instante};<\/script>`;
        const faseEstavel = `<script src="./corponu-calcinha-fase-estavel.js?v=${versao}&cb=${instante}"><\/script>`;
        const vigiaRelease = criarVigiaRelease(release);
        resultado = resultado.replace(/<head>/i, `<head>${bootstrap}`);
        resultado = resultado.replace(/<\/body>/i, `${faseEstavel}${vigiaRelease}</body>`);
        return resultado;
      }

      function alinharUrlComRelease(release) {
        try {
          const url = new URL(window.location.href);
          if (url.searchParams.get("release") !== release) {
            url.searchParams.set("release", release);
            url.searchParams.delete("atualizacao");
            url.searchParams.delete("v");
            url.searchParams.delete("t");
            url.searchParams.delete("_cb");
            window.history.replaceState(null, "", url.toString());
          }
        } catch (_) {}
      }

      function mostrarErro(erro) {
        console.error("[CorpoNu Loader] Falha ao carregar o sistema.", erro);
        const raiz = document.getElementById("corponuLoader");
        if (!raiz) return;
        raiz.innerHTML = `
          <div class="loader-card loader-error">
            <strong>Não foi possível carregar o sistema agora.</strong>
            <span>Verifique a conexão e tente novamente. Nenhum dado foi alterado.</span>
            <button type="button" onclick="window.location.reload()">Tentar novamente</button>
          </div>`;
      }

      async function iniciar() {
        try {
          const release = await obterRelease();
          const respostaShell = await buscarComTentativas(`${SHELL_URL}?release=${encodeURIComponent(release)}`, 4);
          const shell = await respostaShell.text();
          if (!shell || !/<html[\s>]/i.test(shell) || !/<body[\s>]/i.test(shell)) {
            throw new Error("HTML principal inválido.");
          }

          alinharUrlComRelease(release);
          const htmlAtualizado = aplicarVersaoNosAssets(shell, release);

          document.open();
          document.write(htmlAtualizado);
          document.close();
        } catch (erro) {
          mostrarErro(erro);
        }
      }

      iniciar();
    })();
  </script>
</body>
</html>
